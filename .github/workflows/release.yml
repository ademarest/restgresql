name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version
        id: versioning
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

      - name: Update VERSION file
        run: |
          echo "${{ steps.versioning.outputs.new_version }}" > VERSION
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): bump version to ${{ steps.versioning.outputs.new_tag }}"
          git push

      - name: Create Tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.versioning.outputs.new_version }}

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libssl-dev libpq-dev

      - name: Build Binary
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Build and Push Docker Image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          TAG=${{ steps.versioning.outputs.new_tag }}
          docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:latest

      - name: Create .deb Package
        run: |
          VERSION=${{ steps.versioning.outputs.new_tag }}
          PACKAGE_NAME="restgresql"
          BUILD_DIR="deb_build"
          
          mkdir -p $BUILD_DIR/usr/bin
          mkdir -p $BUILD_DIR/DEBIAN
          
          cp build/restgresql $BUILD_DIR/usr/bin/
          
          {
            echo "Package: $PACKAGE_NAME"
            echo "Version: ${VERSION#v}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Depends: libpq5, libssl3, zlib1g, libbz2-1.0, liblzma5, libzstd1"
            echo "Maintainer: Andrew Demarest <andrew@example.com>"
            echo "Description: Lightweight C++ REST API server for PostgreSQL"
          } > $BUILD_DIR/DEBIAN/control
          
          dpkg-deb --build $BUILD_DIR ${PACKAGE_NAME}_${VERSION#v}_amd64.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.new_tag }}
          files: "*.deb"
          generate_release_notes: true
